<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Path Based Routing App1</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #7C3AED, #A855F7);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .card {
            background: rgba(255, 255, 255, .15);
            padding: 45px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, .25);
            box-shadow: 0 10px 25px rgba(0, 0, 0, .35);
            max-width: 800px;
            width: 90%;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 25px;
        }

        p {
            font-size: 22px;
            margin: 15px 0;
        }

        .url {
            margin-top: 25px;
            font-size: 30px;
            font-weight: bold;
            color: #FFF59D;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Path Based Routing App1</h1>

        <p><strong>Application:</strong> kubernetes-ingress-path-base-routing-app1</p>

        <div class="url">app.myexample.co.in/app1</div>
    </div>
</body>

</html>
